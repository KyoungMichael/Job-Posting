
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에너지·화학 채용 모니터</title>
<style>
:root {
  font-family: system-ui, "Malgun Gothic", sans-serif;
  color: #17253b;
  background: #f5f7fb;
}
* { box-sizing: border-box; }
body { margin: 0; }
.wrap { max-width: 1180px; margin: auto; padding: 34px 20px; }
header { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
h1 { font-size: 27px; margin: 0; }
p { color: #637187; }
.pill { border-radius: 30px; background: #e7f5ee; color: #187044; padding: 9px 13px; font-size: 13px; }
.metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin: 24px 0; }
.metric, .panel, .job { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 19px; }
.metric b { display: block; font-size: 28px; margin-top: 8px; }
.muted { color: #718096; font-size: 13px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
button { cursor: pointer; border: 1px solid #d6deea; background: white; border-radius: 9px; padding: 11px 16px; font-weight: 600; color: #334155; }
button.active { background: #183b72; color: white; border-color: #183b72; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
input, select { padding: 12px; border: 1px solid #d6deea; border-radius: 9px; background: white; font: inherit; }
input { flex: 1; min-width: 210px; }
.jobs { display: grid; gap: 11px; }
.job { display: flex; justify-content: space-between; align-items: start; gap: 15px; }
.job h3 { margin: 0 0 8px; font-size: 17px; }
.job p { font-size: 14px; margin: 8px 0; line-height: 1.5; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { background: #eff3f9; border-radius: 6px; padding: 5px 8px; font-size: 12px; color: #4b5d74; }
.new { background: #dff7e8; color: #17663c; }
.warn { background: #fff4da; color: #825500; }
a { color: #185ba8; font-weight: 600; text-decoration: none; white-space: nowrap; }
.foot { font-size: 13px; line-height: 1.6; margin: 22px 0; color: #637187; }
@media(max-width:700px) {
  .metrics { grid-template-columns: repeat(2,1fr); }
  .job { display: block; }
  .job a { display: inline-block; margin-top: 10px; }
  header { align-items: start; flex-direction: column; }
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>에너지·화학 채용 모니터</h1>
      <p>정유·화학 · 탄소포집 · 공정안전 · 금융·컨설팅 채용공고</p>
    </div>
    <span class="pill" id="updated">데이터 로딩 중</span>
  </header>

  <section class="metrics">
    <div class="metric"><span class="muted">검색된 후보 공고</span><b id="total">—</b></div>
    <div class="metric"><span class="muted">최근 24시간 신규 발견</span><b id="new">—</b></div>
    <div class="metric"><span class="muted">이번 검색에서 재발견</span><b id="recent">—</b></div>
    <div class="metric"><span class="muted">검색 오류</span><b id="errors">—</b></div>
  </section>

  <div class="tabs" id="tabs">
    <button class="active" data-cat="전체">전체</button>
    <button data-cat="정유·화학">정유·화학</button>
    <button data-cat="탄소포집">탄소포집·CCUS</button>
    <button data-cat="공정안전">공정안전</button>
    <button data-cat="금융·컨설팅">금융·컨설팅</button>
  </div>

  <div class="filters">
    <input id="q" placeholder="기업명·직무·키워드 검색">
    <select id="fit">
      <option value="">적합도 전체</option>
      <option>상</option><option>중</option><option>하</option>
    </select>
    <select id="period">
      <option value="all">보관된 전체</option>
      <option value="2026">2026년 표기 공고</option>
      <option value="30">최근 30일 발견</option>
    </select>
    <select id="status">
      <option value="all">모집상태 전체</option>
      <option value="unverified">확인 필요</option>
      <option value="archived">이전 수집 공고</option>
    </select>
    <select id="sort">
      <option value="new">최근 발견순</option>
      <option value="fit">적합도순</option>
    </select>
    <button id="csv">CSV 다운로드</button>
  </div>

  <div class="jobs" id="list">
    <div class="panel">데이터를 불러오는 중입니다.</div>
  </div>

  <div class="foot">
    공개 검색엔진 색인에서 발견한 채용 후보입니다.
    2026년 과거 공고도 검색하지만 모든 과거 공고를 복원할 수는 없습니다.
    실제 모집 여부, 근무지, 마감일, 우대사항은 공고 원문에서 확인하세요.
    적합도는 키워드 기반 참고 지표입니다.
  </div>
</main>

<script>
let data = [];
let cat = '전체';
let errors = [];

const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(
  /[&<>"']/g,
  c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

const time = s => s
  ? new Date(s).toLocaleString('ko-KR', {timeZone:'Asia/Seoul'})
  : '미확인';

const isNew = j =>
  Date.now() - new Date(j.first_seen).getTime() < 86400000;

function filtered() {
  const q = $('q').value.trim().toLowerCase();
  const f = $('fit').value;

  let a = data.filter(j => {
    const period = $('period').value;
    const st = $('status').value;
    const date = Date.parse(j.first_seen || '');

    const periodOk =
      period === 'all' ||
      (
        period === '2026' &&
        (
          (j.posting_date_hint || '').startsWith('2026') ||
          String(j.title + ' ' + j.description).includes('2026')
        )
      ) ||
      (
        period === '30' &&
        Date.now() - date < 30 * 86400000
      );

    return (
      (cat === '전체' || j.category === cat) &&
      (!f || j.fit === f) &&
      periodOk &&
      (
        st === 'all' ||
        (st === 'archived' && !j.seen_in_latest_run) ||
        (st === 'unverified' && j.status?.includes('확인 필요'))
      ) &&
      [j.title, j.description, j.source]
        .join(' ')
        .toLowerCase()
        .includes(q)
    );
  });

  if ($('sort').value === 'fit') {
    const rank = {상:3, 중:2, 하:1};
    a.sort((x,y) => (rank[y.fit] || 0) - (rank[x.fit] || 0));
  } else {
    a.sort((x,y) =>
      String(y.first_seen || '').localeCompare(
        String(x.first_seen || '')
      )
    );
  }

  return a;
}

function render() {
  const a = filtered();

  $('list').innerHTML = a.length
    ? a.map(j => `
      <article class="job">
        <div>
          <h3>${esc(j.title)}</h3>
          <div class="tags">
            <span class="tag">${esc(j.category)}</span>
            <span class="tag">적합도 ${esc(j.fit)}</span>
            ${isNew(j)
              ? '<span class="tag new">24시간 내 신규 발견</span>'
              : ''}
            ${!j.seen_in_latest_run
              ? '<span class="tag warn">이번 검색 미발견</span>'
              : ''}
          </div>
          <p>${esc(j.description).slice(0,320)}</p>
          <div class="muted">
            ${esc(j.source)} ·
            최초 발견 ${time(j.first_seen)} ·
            ${esc(j.status)} ·
            ${esc(j.location_check || '근무지 미확인')}
          </div>
        </div>
        <a href="${esc(j.url)}"
           target="_blank"
           rel="noopener noreferrer">
          공고 원문 ↗
        </a>
      </article>
    `).join('')
    : '<div class="panel">조건에 맞는 공고가 없습니다. 검색 결과가 없거나 수집이 제한되었을 수 있습니다.</div>';
}

$('tabs').onclick = e => {
  if (e.target.tagName !== 'BUTTON') return;

  document.querySelectorAll('#tabs button').forEach(
    b => b.classList.remove('active')
  );

  e.target.classList.add('active');
  cat = e.target.dataset.cat;
  render();
};

['q','fit','period','status','sort'].forEach(id =>
  $(id).addEventListener('input', render)
);

$('csv').onclick = () => {
  const rows = [
    ['분야','제목','출처','적합도','최초발견','원문URL'],
    ...filtered().map(j => [
      j.category,
      j.title,
      j.source,
      j.fit,
      j.first_seen,
      j.url
    ])
  ];

  const csv = '\ufeff' + rows.map(r =>
    r.map(v =>
      '"' + String(v ?? '').replace(/"/g,'""') + '"'
    ).join(',')
  ).join('\r\n');

  const u = URL.createObjectURL(
    new Blob([csv], {type:'text/csv;charset=utf-8'})
  );

  const a = document.createElement('a');
  a.href = u;
  a.download = '채용공고.csv';
  a.click();
  URL.revokeObjectURL(u);
};

fetch('./data/jobs.json?ts=' + Date.now())
  .then(r => {
    if (!r.ok) throw Error('HTTP ' + r.status);
    return r.json();
  })
  .then(d => {
    data = d.jobs || [];
    errors = d.errors || [];

    $('updated').textContent = '최근 수집 ' + time(d.updated_at);
    $('total').textContent = data.length;
    $('new').textContent = data.filter(isNew).length;
    $('recent').textContent =
      data.filter(j => j.seen_in_latest_run).length;
    $('errors').textContent = errors.length;

    if (errors.length) {
      $('errors').title = errors.join('\n');
    }

    render();
  })
  .catch(e => {
    $('updated').textContent = '데이터 로딩 실패';
    $('list').textContent =
      '데이터 파일을 불러올 수 없습니다: ' + e.message;
  });
</script>
</body>
</html>
